<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .left-panel {
            width: 350px;
            background-color: #f4f4f4;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        .search-container {
            display: flex;
            margin-bottom: 20px;
        }

        .search-container input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-container button {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #ffe812;
            border: 1px solid #ffe812;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .result-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .result-item {
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #f9f9f9;
        }

        .result-item h4 {
            margin-bottom: 5px;
            color: #333;
        }

        .result-item p {
            font-size: 12px;
            color: #666;
        }

        .right-panel {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="search-container">
                <input type="text" id="keyword" placeholder="장소를 입력하세요" onkeypress="if(event.keyCode==13) searchPlaces();">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul class="result-list" id="placesList">
                <!-- 검색 결과가 표시될 곳 -->
            </ul>
        </div>

        <div class="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <!-- API 키 적용 및 autoload=false 추가 완료 -->
