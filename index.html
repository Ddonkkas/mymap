<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동할 곳 찾기 - 카카오맵</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 왼쪽 패널: 탭 버튼 및 결과 리스트 */
        .left-panel {
            width: 360px;
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #222;
        }

        /* 탭 버튼 영역 */
        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            background-color: #ffffff;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #f1f3f5;
        }

        /* 활성화된 탭 스타일 */
        .tab-btn.active {
            background-color: #2b8a3e;
            color: #ffffff;
            border-color: #2b8a3e;
        }

        .status-message {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* 검색 결과 리스트 */
        .result-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .result-item {
            padding: 14px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .result-item:hover {
            border-color: #2b8a3e;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .result-item h4 {
            font-size: 15px;
            color: #212529;
            margin-bottom: 6px;
        }

        .result-item p {
            font-size: 13px;
            color: #6c757d;
            line-height: 1.4;
        }

        .result-item .badge {
            display: inline-block;
            font-size: 11px;
            background-color: #ffe8cc;
            color: #d9480f;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .result-item .phone {
            font-size: 12px;
            color: #2b8a3e;
            margin-top: 4px;
        }

        /* 오른쪽 패널: 지도 */
        .right-panel {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 마커 클릭 말풍선(InfoWindow) 커스텀 스타일 */
        .info-bubble {
            padding: 10px 14px;
            font-size: 13px;
            min-width: 180px;
            max-width: 250px;
            line-height: 1.4;
        }

        .info-bubble strong {
            display: block;
            font-size: 14px;
            color: #111;
            margin-bottom: 4px;
        }

        .info-bubble span {
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 패널 -->
        <div class="left-panel">
            <h1 class="panel-title">내 주변 운동 스팟</h1>

            <!-- 탭 버튼 -->
            <div class="tab-group">
                <button type="button" class="tab-btn active" id="tabPark" onclick="switchCategory('공원')">농구장(공원)</button>
                <button type="button" class="tab-btn" id="tabGym" onclick="switchCategory('헬스장')">헬스장</button>
            </div>

            <p class="status-message" id="statusMessage">현재 위치를 확인하는 중입니다...</p>

            <!-- 장소 목록 표시 영역 -->
            <ul class="result-list" id="placesList"></ul>
        </div>

        <!-- 오른쪽 패널 (지도) -->
        <div class="right-panel">
            <div id="map"></div>
        </div>
    </div>

    <!-- 카카오맵 SDK -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=23728e2d105f43c55510848993d11289&libraries=services&autoload=false"></script>

    <script>
        // 전역 상태 변수
        let map;
        let placesService;
        let userPosition = null;
        let markers = [];
        let activeInfoWindow = null;
        let currentCategory = '공원';

        // 1. 농구공 마커 이미지 (농구장 공원용 SVG Data URI)
        const basketballSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="%23f76707" stroke="%23ffffff" stroke-width="2"/><line x1="2" y1="18" x2="34" y2="18" stroke="%23ffffff" stroke-width="2"/><line x1="18" y1="2" x2="18" y2="34" stroke="%23ffffff" stroke-width="2"/><path d="M7 6 A17 17 0 0 1 7 30" fill="none" stroke="%23ffffff" stroke-width="2"/><path d="M29 6 A17 17 0 0 0 29 30" fill="none" stroke="%23ffffff" stroke-width="2"/></svg>`;

        // 2. 아령 마커 이미지 (헬스장용 SVG Data URI)
        const dumbbellSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="%232b8a3e" stroke="%23ffffff" stroke-width="2"/><rect x="8" y="13" width="4" height="10" rx="1.5" fill="%23ffffff"/><rect x="24" y="13" width="4" height="10" rx="1.5" fill="%23ffffff"/><rect x="11" y="16.5" width="14" height="3" fill="%23ffffff"/></svg>`;

        // 카카오맵 SDK 로드 후 초기화
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map');
            const defaultPosition = new kakao.maps.LatLng(37.566826, 126.9786567); // 서울 기본 위치
            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
            activeInfoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 지도 영역 클릭 시 열려있는 말풍선 닫기
            kakao.maps.event.addListener(map, 'click', function() {
                if (activeInfoWindow) {
                    activeInfoWindow.close();
                }
            });

            // 사용자 위치 확인
            initUserLocation();
        });

        // 사용자 현재 위치 가져오기
        function initUserLocation() {
            const statusEl = document.getElementById('statusMessage');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        userPosition = new kakao.maps.LatLng(lat, lon);

                        map.setCenter(userPosition);

                        // 내 현재 위치 마커 표시
                        new kakao.maps.Marker({
                            position: userPosition,
                            map: map
                        });

                        statusEl.innerText = '내 위치 주변의 농구 가능한 공원/체육시설을 검색합니다.';
                        executeCategorySearch(currentCategory);
                    },
                    function(error) {
                        console.error('위치 접근 실패:', error);
                        statusEl.innerText = '위치 권한 거부로 기본 위치(서울) 주변을 검색합니다.';
                        userPosition = new kakao.maps.LatLng(37.566826, 126.9786567);
                        executeCategorySearch(currentCategory);
                    }
                );
            } else {
                statusEl.innerText = '이 브라우저는 위치 정보를 지원하지 않아 기본 위치로 검색합니다.';
                userPosition = new kakao.maps.LatLng(37.566826, 126.9786567);
                executeCategorySearch(currentCategory);
            }
        }

        // 탭 버튼 클릭 시 호출
        function switchCategory(categoryName) {
            currentCategory = categoryName;

            const parkBtn = document.getElementById('tabPark');
            const gymBtn = document.getElementById('tabGym');
            const statusEl = document.getElementById('statusMessage');

            if (categoryName === '공원') {
                parkBtn.classList.add('active');
                gymBtn.classList.remove('active');
                statusEl.innerText = '공원 및 체육시설 내 농구장 스팟을 검색 중입니다...';
            } else {
                gymBtn.classList.add('active');
                parkBtn.classList.remove('active');
                statusEl.innerText = '주변 헬스장을 검색 중입니다...';
            }

            executeCategorySearch(categoryName);
        }

        // 카테고리별 검색 분기
        function executeCategorySearch(category) {
            if (!placesService) return;

            // 공원 탭인 경우: 농구 시설이 확인되는 키워드로 다중 검색 실행
            if (category === '공원') {
                searchBasketballParks();
            } else {
                searchGyms();
            }
        }

        // 농구 시설이 있는 공원/체육시설 집중 검색
        function searchBasketballParks() {
            clearExistingResults();

            const searchOptions = {
                location: userPosition,
                radius: 6000, // 6km 반경으로 조금 넉넉히 탐색
                sort: kakao.maps.services.SortBy.ACCURACY
            };

            // 농구 시설과 관련된 대표 키워드들
            const targetKeywords = ['농구장', '공원 농구장', '야외농구장'];
            const aggregatedResults = [];
            const seenPlaceIds = new Set();
            let completedRequests = 0;

            targetKeywords.forEach(keyword => {
                placesService.keywordSearch(keyword, function(data, status) {
                    completedRequests++;

                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(item => {
                            // 중복 장소 제거 및 농구장/공원/체육 관련 장소만 필터링
                            if (!seenPlaceIds.has(item.id)) {
                                seenPlaceIds.add(item.id);
                                aggregatedResults.push(item);
                            }
                        });
                    }

                    // 모든 키워드 검색 요청이 끝났을 때 결과 렌더링
                    if (completedRequests === targetKeywords.length) {
                        if (aggregatedResults.length > 0) {
                            displayResults(aggregatedResults, '공원');
                            document.getElementById('statusMessage').innerText = `농구 시설이 확인된 장소 ${aggregatedResults.length}곳을 찾았습니다!`;
                        } else {
                            document.getElementById('placesList').innerHTML = '<li style="padding:20px; text-align:center; color:#888;">반경 내에 등록된 농구 시설(공원 농구장 등)을 찾을 수 없습니다.</li>';
                            document.getElementById('statusMessage').innerText = '주변에 농구 시설 정보가 등록된 곳이 없습니다.';
                        }
                    }
                }, searchOptions);
            });
        }

        // 헬스장 일반 검색
        function searchGyms() {
            clearExistingResults();

            const searchOptions = {
                location: userPosition,
                radius: 4000,
                sort: kakao.maps.services.SortBy.ACCURACY
            };

            placesService.keywordSearch('헬스장', function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    displayResults(data, '헬스장');
                    document.getElementById('statusMessage').innerText = `주변 헬스장 ${data.length}곳을 찾았습니다.`;
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    document.getElementById('placesList').innerHTML = '<li style="padding:20px; text-align:center; color:#888;">주변에 검색 결과가 없습니다.</li>';
                } else {
                    alert('검색 중 오류가 발생했습니다.');
                }
            }, searchOptions);
        }

        // 기존 마커 및 리스트 삭제
        function clearExistingResults() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];

            if (activeInfoWindow) {
                activeInfoWindow.close();
            }

            document.getElementById('placesList').innerHTML = '';
        }

        // 검색 결과 지도 및 리스트에 반영
        function displayResults(places, category) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();

            const iconUrl = category === '공원' ? basketballSvg : dumbbellSvg;
            const iconSize = new kakao.maps.Size(34, 34);
            const iconOption = { offset: new kakao.maps.Point(17, 17) };
            const markerImage = new kakao.maps.MarkerImage(iconUrl, iconSize, iconOption);

            for (let i = 0; i < places.length; i++) {
                const place = places[i];
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                // 마커 생성
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: map,
                    image: markerImage
                });
                markers.push(marker);
                bounds.extend(placePosition);

                // 말풍선 내용
                const addressText = place.road_address_name || place.address_name;
                const infoContent = `
                    <div class="info-bubble">
                        <strong>${place.place_name}</strong>
                        <span>${addressText}</span>
                    </div>
                `;

                // 마커 클릭 시 말풍선
                kakao.maps.event.addListener(marker, 'click', function() {
                    activeInfoWindow.setContent(infoContent);
                    activeInfoWindow.open(map, marker);
                    map.panTo(placePosition);
                });

                // 리스트 아이템 추가
                const itemEl = createListItem(place, category);
                itemEl.onclick = function() {
                    activeInfoWindow.setContent(infoContent);
                    activeInfoWindow.open(map, marker);
                    map.panTo(placePosition);
                };

                listEl.appendChild(itemEl);
            }

            map.setBounds(bounds);
        }

        // 리스트 항목 DOM 요소 생성
        function createListItem(place, category) {
            const item = document.createElement('li');
            item.className = 'result-item';

            const addressText = place.road_address_name || place.address_name;
            const phoneText = place.phone ? `<p class="phone">${place.phone}</p>` : '';
            const badgeText = category === '공원' ? '<span class="badge">🏀 농구 시설 확인</span>' : '<span class="badge" style="background:#e6fcf5; color:#0ca678;">🏋️ 헬스장</span>';

            item.innerHTML = `
                ${badgeText}
                <h4>${place.place_name}</h4>
                <p>${addressText}</p>
                ${phoneText}
            `;
            return item;
        }
    </script>
</body>
</html>
